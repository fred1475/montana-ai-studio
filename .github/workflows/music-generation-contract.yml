name: Studio 2.0 AI music contract tests
on:
  pull_request:
    paths:
      - 'server/music-generation.js'
      - 'server/lyria-provider.js'
      - 'server/d1-quota.js'
      - 'server/worker-api.js'
      - 'server/r2-audio-store.js'
      - 'server/worker-runtime.js'
      - 'private-music-import.js'
      - 'mixer-8.html'
      - 'server/schema/d1-quota.sql'
      - 'tests/music-generation-contract.cjs'
      - 'tests/lyria-provider.cjs'
      - 'tests/d1-quota.cjs'
      - 'tests/worker-api.cjs'
      - 'tests/r2-audio-store.cjs'
      - 'tests/worker-runtime.cjs'
      - 'tests/private-music-import.cjs'
      - 'docs/AI-MUSIC-SERVER-CONTRACT.md'
      - 'docs/PRIVATE-GATEWAY-STAGING.md'
      - 'docs/100-PERCENT-ACCEPTANCE.md'
      - '.github/workflows/music-generation-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-music-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate server-only contract syntax
        run: |
          node --check server/music-generation.js
          node --check server/lyria-provider.js
          node --check server/d1-quota.js
          node --check server/worker-api.js
          node --check server/r2-audio-store.js
          node --check server/worker-runtime.js
          node --check private-music-import.js
          node --check tests/music-generation-contract.cjs
          node --check tests/lyria-provider.cjs
          node --check tests/d1-quota.cjs
          node --check tests/worker-api.cjs
          node --check tests/r2-audio-store.cjs
          node --check tests/worker-runtime.cjs
          node --check tests/private-music-import.cjs
      - name: Test safe access, idempotency, quotas and failure behavior
        run: node --test tests/music-generation-contract.cjs tests/lyria-provider.cjs tests/d1-quota.cjs tests/worker-api.cjs tests/r2-audio-store.cjs tests/worker-runtime.cjs tests/private-music-import.cjs
