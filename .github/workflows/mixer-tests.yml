name: Studio mixer browser tests
on:
  pull_request:
    paths:
      - 'mixer-8.html'
      - 'mixer-session.js'
      - 'mixer-record.js'
      - 'mixer-timeline.js'
      - 'tests/mixer-smoke.cjs'
      - '.github/workflows/mixer-tests.yml'
  workflow_dispatch:
jobs:
  mixer-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify test syntax
        run: |
          node --check tests/mixer-smoke.cjs
          node --check mixer-session.js
          node --check mixer-record.js
          node --check mixer-timeline.js
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run mixer functional checks
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/studio-server.log 2>&1 &
          sleep 2
          node tests/mixer-smoke.cjs
