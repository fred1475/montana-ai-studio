name: Studio mixer browser tests
on:
  pull_request:
    paths:
      - 'mixer-8.html'
      - 'mixer-session.js'
      - 'mixer-record.js'
      - 'mixer-meter.js'
      - 'mixer-stems.js'
      - 'mixer-fades.js'
      - 'mixer-recovery.js'
      - 'mixer-export-levels.js'
      - 'mixer-loudness.js'
      - 'mixer-master-audit.js'
      - 'mixer-split.js'
      - 'mixer-crossfade.js'
      - 'mixer-clipboard.js'
      - 'mixer-grid.js'
      - 'docs/RELEASE-CHECKLIST.md'
      - 'hardware-check.html'
      - 'hardware-check.js'
      - 'hardware-diagnostics.js'
      - 'tests/hardware-check.cjs'
      - 'tests/mixer-grid.cjs'
      - 'tests/mixer-clipboard.cjs'
      - 'tests/mixer-crossfade.cjs'
      - 'tests/mixer-split.cjs'
      - 'tests/mixer-multiclip.cjs'
      - 'tests/mixer-master-audit.cjs'
      - 'tests/mixer-loudness.cjs'
      - 'tests/mixer-ebu-reference.cjs'
      - 'docs/EBU-R128-VALIDATION.md'
      - 'tests/mixer-loops.cjs'
      - 'tests/mixer-export-levels.cjs'
      - 'tests/mixer-recovery.cjs'
      - 'tests/mixer-fades.cjs'
      - 'tests/mixer-stems.cjs'
      - 'mixer-limiter.js'
      - 'mixer-vocal-dsp.js'
      - 'mixer-vocal-clean.js'
      - 'tests/mixer-vocal-dsp.cjs'
      - 'tests/mixer-vocal-clean.cjs'
      - 'tests/mixer-limiter.cjs'
      - 'mixer-pitch.js'
      - 'pitch-lab.html'
      - 'pitch-engine.js'
      - 'pitch-melody.js'
      - 'tests/pitch-engine.cjs'
      - 'tests/pitch-melody.cjs'
      - 'tests/pitch-ui.cjs'
      - 'mixer-timeline.js'
      - 'mixer-history.js'
      - 'mixer-metronome.js'
      - 'tests/mixer-smoke.cjs'
      - 'tests/mixer-pitch.cjs'
      - 'tests/mixer-sync.cjs'
      - 'tests/mixer-record.cjs'
      - '.github/workflows/mixer-tests.yml'
  workflow_dispatch:
jobs:
  mixer-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify test syntax
        run: |
          node --check tests/mixer-smoke.cjs
          node --check mixer-session.js
          node --check mixer-record.js
          node --check mixer-meter.js
          node --check mixer-stems.js
          node --check mixer-fades.js
          node --check mixer-recovery.js
          node --check mixer-export-levels.js
          node --check mixer-loudness.js
          node --check mixer-master-audit.js
          node --check mixer-split.js
          node --check mixer-crossfade.js
          node --check mixer-clipboard.js
          node --check mixer-grid.js
          node --check hardware-check.js
          node --check hardware-diagnostics.js
          node --check tests/hardware-check.cjs
          node --check tests/mixer-grid.cjs
          node --check tests/mixer-clipboard.cjs
          node --check tests/mixer-crossfade.cjs
          node --check tests/mixer-split.cjs
          node --check tests/mixer-multiclip.cjs
          node --check tests/mixer-master-audit.cjs
          node --check tests/mixer-loudness.cjs
          node --check tests/mixer-ebu-reference.cjs
          node --check tests/mixer-loops.cjs
          node --check tests/mixer-export-levels.cjs
          node --check tests/mixer-recovery.cjs
          node --check tests/mixer-fades.cjs
          node --check tests/mixer-stems.cjs
          node --check mixer-limiter.js
          node --check mixer-vocal-dsp.js
          node --check mixer-vocal-clean.js
          node --check tests/mixer-vocal-dsp.cjs
          node --check tests/mixer-vocal-clean.cjs
          node tests/mixer-vocal-dsp.cjs
          node --check tests/mixer-limiter.cjs
          node tests/mixer-limiter.cjs
          node --check mixer-pitch.js
          node --check tests/mixer-pitch.cjs
          node --check tests/mixer-sync.cjs
          node --check tests/mixer-record.cjs
          node --check pitch-engine.js
          node --check pitch-melody.js
          node --check tests/pitch-melody.cjs
          node tests/pitch-melody.cjs
          node --check tests/pitch-engine.cjs
          node --check tests/pitch-ui.cjs
          node tests/pitch-engine.cjs
          node --check mixer-timeline.js
          node --check mixer-history.js
          node --check mixer-metronome.js
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify FFmpeg reference availability
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          ffmpeg -hide_banner -version | head -n 1
      - name: Run mixer functional checks
        run: |
          node tests/mixer-ebu-reference.cjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/studio-server.log 2>&1 &
          sleep 2
          node tests/mixer-smoke.cjs
          node tests/mixer-pitch.cjs
          node tests/mixer-sync.cjs
          node tests/mixer-stems.cjs
          node tests/mixer-fades.cjs
          node tests/mixer-recovery.cjs
          node tests/mixer-export-levels.cjs
          node tests/mixer-loudness.cjs
          node tests/mixer-master-audit.cjs
          node tests/mixer-split.cjs
          node tests/mixer-multiclip.cjs
          node tests/mixer-crossfade.cjs
          node tests/mixer-clipboard.cjs
          node tests/mixer-grid.cjs
          node tests/hardware-check.cjs
          node tests/mixer-loops.cjs
          node tests/mixer-record.cjs
          node tests/mixer-vocal-clean.cjs
          node tests/pitch-ui.cjs
      - name: Package manual mixer preview
        run: |
          mkdir -p mixer-preview
          cp docs/EBU-R128-VALIDATION.md mixer-preview/VALIDACION-EBU-R128.md
          cp docs/RELEASE-CHECKLIST.md mixer-preview/CHECKLIST-ANTES-DE-PUBLICAR.md
          cp hardware-check.html hardware-check.js hardware-diagnostics.js mixer-8.html mixer-grid.js mixer-crossfade.js mixer-clipboard.js mixer-split.js mixer-stems.js mixer-fades.js mixer-recovery.js mixer-export-levels.js mixer-loudness.js mixer-master-audit.js mixer-limiter.js mixer-vocal-dsp.js mixer-vocal-clean.js mixer-session.js mixer-record.js mixer-timeline.js mixer-history.js mixer-metronome.js mixer-meter.js mixer-pitch.js pitch-lab.html pitch-engine.js pitch-melody.js studio.html studio.js backup.js mixer-preview/
          printf '%s\n' \
            'MONTANA AI STUDIO — MIXER 8 TRACKS / DEVELOPMENT PREVIEW' \
            '1. Extraiga los archivos en la misma carpeta.' \
            '2. Abra mixer-8.html en Chrome o Edge.' \
            '3. Importe dos WAV cortos para probar reproducción, recortes, panorama y exportación.' \
            '4. Pruebe el compresor dentro del panel de cada pista y escuche la diferencia.' \
            '5. Mueva el bloque en la línea de tiempo con el ratón y guarde la sesión JSON.' \
            '6. Abra esa sesión JSON para comprobar que se recuperan pistas y posiciones.' \
            '7. La grabación con micrófono puede requerir HTTPS o localhost; no se garantiza desde file://.' \
            '8. Observe niveles por pista y mezcla final durante reproducción.' \
            '9. La afinación vocal experimental se aplica en los canales 2–8 a fragmentos breves; NO es Auto-Tune profesional.' \
            '10. Pruebe pitch-lab.html en modo sostenido o frase experimental de dos notas: NO es Auto-Tune profesional.' \
            '11. Use Deshacer/Rehacer para ajustar posición y recortes sin destruir audio.' \
            '12. Active el metrónomo y ajuste BPM; los clics no están en el WAV exportado.' \
            '13. Active el limitador maestro solo para exportar WAV y seleccione techo de muestra; no mide true-peak ni LUFS.' \
            '14. En cada canal de voz puede activar puerta de ruido y de-esser locales; son una beta, escuchar antes de entregar.' \
            '15. Use alineación vocal manual de -250 a +250 ms y Rescatar fuente del canal después de una toma.' \
            '16. Aún falta calibración automática con equipo físico; esta es una beta.' \
            '17. Descargue cada stem WAV o todos en ZIP. Archivos alineados desde 0:00, sin mezcla maestra ni mute/solo.' \
            '18. Ajuste los fundidos de entrada/salida de cada pista. Se aplican al WAV, stems y referencia de grabación.' \
            '19. Active el autoguardado local de IndexedDB solo si lo desea; restaure manualmente y conserve un JSON de respaldo.' \
            '20. Pruebe normalización de picos de muestra y medición RMS al exportar; no equivale a LUFS o true-peak.' \
            '21. Active medición EBU R128 orientativa: integrado, M, S, LRA y true-peak 4×. Comparada con FFmpeg; NO está oficialmente certificada.' \
            '22. Puede repetir 1–8 veces una región recortada en su pista, escuchándola y exportando WAV/stems.' \
            '23. Active Auditoría de master WAV si desea JSON EBU de preentrega con CRC32 del PCM16 exacto.' \
            '24. Use hasta cuatro fragmentos, cuatro copias adicionales y BPM grid snap opcional (1/4, 1/8, 1/16) en la línea de tiempo.' \
            '25. Hardware check preparado: abra hardware-check.html para probar físicamente la interfaz SOLO cuando lleguemos a la validación final.' \
            '26. Este módulo NO está terminado. Use audio de prueba y conserve siempre sus originales.' > mixer-preview/README.txt
      - uses: actions/upload-artifact@v5
        with:
          name: montana-mixer-8-preview
          path: mixer-preview/
          retention-days: 7
