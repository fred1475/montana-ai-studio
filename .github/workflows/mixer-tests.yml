            '2. Abra mixer-8.html en Chrome o Edge.' \
            '3. Importe dos WAV cortos para probar reproducción, recortes, panorama y exportación.' \
            '4. Pruebe el compresor dentro del panel de cada pista y escuche la diferencia.' \
            '5. Mueva el bloque en la línea de tiempo con el ratón y guarde la sesión JSON.' \
            '6. Abra esa sesión JSON para comprobar que se recuperan pistas y posiciones.' \
            '7. La grabación con micrófono puede requerir HTTPS o localhost; no se garantiza desde file://.' \
            '8. Observe niveles por pista y mezcla final durante reproducción.' \
            '9. La afinación vocal experimental se aplica en los canales 2–8 a fragmentos breves; NO es Auto-Tune profesional.' \
            '10. Pruebe pitch-lab.html y el control de mezcla seco/procesado de 0 a 100%; no es afinación profesional. El WAV incorpora esa mezcla y el original permanece intacto.' \
            '11. Use Deshacer/Rehacer para ajustar posición y recortes sin destruir audio.' \
